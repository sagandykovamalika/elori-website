name: Validate localized FAQs

on:
  pull_request:
    paths:
      - "faq/**"
      - "*/faq/**"
      - "assets/faq-toc.js"
      - "styles.css"
      - "scripts/validate-faq-locales.py"
      - ".github/workflows/faq-validation.yml"
  push:
    branches: [main]
    paths:
      - "faq/**"
      - "*/faq/**"
      - "assets/faq-toc.js"
      - "styles.css"
      - "scripts/validate-faq-locales.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate checked-in FAQ files
        run: python3 scripts/validate-faq-locales.py
